<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Editor</title>
<style>
  :root {
    --bg: #f3f4f6;
    --panel: #fff;
    --text: #111827;
    --muted: #6b7280;
    --border: #d1d5db;
    --accent: #2563eb
  }

  * {
    box-sizing: border-box
  }

  html,
  body {
    margin: 0;
    height: 100%;
    font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    background: var(--bg);
    color: var(--text)
  }

  body.dark {
    --bg: #111827;
    --panel: #1f2937;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #374151
  }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column
  }

  .top {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    position: sticky;
    top: 0;
    z-index: 2
  }

  .brand {
    font-weight: 700;
    margin-bottom: 8px
  }

  .brand small {
    color: var(--muted);
    font-weight: 500;
    margin-left: 7px
  }

  .toolbar {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center
  }

  button,
  select,
  input {
    font: inherit
  }

  button,
  select {
    height: 34px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 7px;
    padding: 0 9px;
    cursor: pointer
  }

  button:hover,
  select:hover {
    border-color: var(--accent)
  }

  .sep {
    width: 1px;
    height: 25px;
    background: var(--border);
    margin: 0 2px
  }

  .main {
    flex: 1;
    overflow: auto;
    padding: 24px 12px
  }

  .paper {
    width: min(900px, 100%);
    min-height: calc(100vh - 170px);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    margin: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 24px #0001;
    padding: 44px;
    outline: 0;
    line-height: 1.6;
    font-size: 16px
  }

  .paper:empty:before {
    content: "Start typing here…";
    color: var(--muted)
  }

  .paper img {
    max-width: 100%;
    height: auto
  }

  .paper table {
    border-collapse: collapse;
    width: 100%
  }

  .paper td,
  .paper th {
    border: 1px solid var(--border);
    padding: 8px
  }

  .status {
    font-size: 12px;
    color: var(--muted);
    padding: 7px 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    text-align: right
  }

  #file {
    display: none
  }

  @media(max-width:700px) {
    .paper {
      padding: 22px
    }
  }

  @media print {

    .top,
    .status {
      display: none !important
    }

    .main {
      padding: 0
    }

    .paper {
      border: 0;
      box-shadow: none;
      width: 100%;
      padding: 0
    }
  }

  .filebar {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-bottom: 8px;
    font-size: 14px
  }

  .filelabel {
    color: var(--muted);
    margin-right: 5px
  }

  .filename,
  .extension {
    padding: 2px 4px;
    border-radius: 4px;
    outline: none;
    min-width: 20px
  }

  .filename:focus,
  .extension:focus {
    background: var(--bg);
    box-shadow: 0 0 0 1px var(--accent)
  }

  .filename {
    font-weight: 600
  }

  .dot {
    color: var(--muted)
  }

  button svg {
    display: block;
    pointer-events: none
  }

</style>

<body>
  <div class="app">
    <div class="top">
      <div class="filebar"><span class="filelabel">File:</span><span id="filename" class="filename" contenteditable="true" spellcheck="false" title="Click to change the file name">document</span><span class="dot">.</span><span id="extension" class="extension" contenteditable="true" spellcheck="false" title="Click to change the extension">txt</span></div>
      <div class="toolbar"><select id="fmt">
          <option value="p">Normal</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
          <option value="blockquote">Quote</option>
          <option value="pre">Code</option>
        </select><button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button><button data-c="strikeThrough"><s>S</s></button><span class="sep"></span><button data-c="insertUnorderedList">• List</button><button data-c="insertOrderedList">1. List</button><button data-c="justifyLeft">←</button><button data-c="justifyCenter">↔</button><button data-c="justifyRight">→</button><span class="sep"></span><button id="link">🔗</button><button id="unlink">Unlink</button><button id="img">🖼</button><input id="fg" type="color" value="#111111" title="Text color"><input id="bg" type="color" value="#ffff00" title="Highlight"><button id="undo">↶</button><button id="redo">↷</button><span class="sep"></span><button id="copy">📄 Copy</button><button id="paste">📋 Paste</button><span class="sep"></span><button id="open">📂 Open</button><button id="save" title="Download" aria-label="Download"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg></button><button id="print">🖨</button><button id="theme">◐</button><button id="clear">🗑</button></div>
    </div>
    <div class="main">
      <article id="p" class="paper" contenteditable spellcheck="true"></article>
    </div>
    <div class="status" id="stat">0 words · 0 characters</div><input id="file" type="file" accept=".html,.htm,.txt,text/html,text/plain,image/*">
  </div>
  <script>
    const $ = id => document.getElementById(id),
      p = $('p');

    function cmd(c, v) {
      p.focus();
      document.execCommand(c, false, v);
      update()
    }
    document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => cmd(b.dataset.c));
    $('fmt').onchange = () => cmd('formatBlock', $('fmt').value);
    $('undo').onclick = () => cmd('undo');
    $('redo').onclick = () => cmd('redo');

    function flash(b) {
      let o = b.innerHTML;
      b.textContent = '✓';
      setTimeout(() => b.innerHTML = o, 900)
    }
    $('copy').onclick = async () => {
      let s = getSelection(),
        has = s.rangeCount && !s.isCollapsed && p.contains(s.anchorNode),
        t = has ? s.toString() : p.innerText;
      try {
        await navigator.clipboard.writeText(t)
      } catch (e) {
        if (!has) {
          let r = document.createRange();
          r.selectNodeContents(p);
          s.removeAllRanges();
          s.addRange(r)
        }
        document.execCommand('copy')
      }
      flash($('copy'))
    };
    $('paste').onclick = async () => {
      p.focus();
      try {
        let t = await navigator.clipboard.readText();
        if (t) {
          cmd('insertText', t);
          flash($('paste'))
        }
      } catch (e) {
        alert('Pasting is blocked by the browser. Long-press in the document and choose Paste.')
      }
    };
    $('link').onclick = () => {
      let u = prompt('URL:');
      if (u) cmd('createLink', /^https?:\/\//i.test(u) ? u : 'https://' + u)
    };
    $('unlink').onclick = () => cmd('unlink');
    $('img').onclick = () => {
      let u = prompt('Image URL:');
      if (u) cmd('insertImage', u)
    };
    $('fg').oninput = () => cmd('foreColor', $('fg').value);
    $('bg').oninput = () => cmd('hiliteColor', $('bg').value);
    $('print').onclick = () => print();
    $('theme').onclick = () => {
      let d = document.body.classList.toggle('dark');
      try {
        localStorage.setItem('minieditor-theme', d ? 'dark' : 'light')
      } catch (e) {}
    };
    $('clear').onclick = () => {
      if (confirm('Clear everything?')) {
        p.innerHTML = '';
        update();
        p.focus()
      }
    };
    $('open').onclick = () => $('file').click();
    $('file').onchange = async e => {
      let f = e.target.files[0];
      if (!f) return;
      let parts = f.name.split('.');
      $('extension').textContent = parts.length > 1 ? parts.pop() : 'txt';
      $('filename').textContent = parts.join('.') || 'document';
      let t = await f.text();
      p.innerHTML = /\.txt$/i.test(f.name) ? '<p>' + esc(t).replace(/\n/g, '<br>') + '</p>' : new DOMParser().parseFromString(t, 'text/html').body.innerHTML;
      update()
    };

    function esc(s) {
      return s.replace(/[&<>"]/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
      } [c]))
    }
    $('save').onclick = () => {
      let n = $('filename').textContent.trim().replace(/[\/:*?"<>|]/g, '') || 'document';
      let x = $('extension').textContent.trim().replace(/[^a-zA-Z0-9_-]/g, '').toLowerCase() || 'txt';
      let rich = ['html', 'htm', 'xhtml'].includes(x);
      let s = rich ? '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(n) + '</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6;color:#111}img{max-width:100%;height:auto}a{color:#2563eb}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px}blockquote{border-left:4px solid #ccc;margin:1em 0;padding-left:1em}pre{white-space:pre-wrap}</style></head><body>' + p.innerHTML + '</body></html>' : p.innerText;
      let a = document.createElement('a'),
        b = new Blob([s], {
          type: rich ? 'text/html;charset=utf-8' : 'text/plain;charset=utf-8'
        }),
        u = URL.createObjectURL(b);
      a.href = u;
      a.download = n + '.' + x;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 1000)
    };
    p.ondragover = e => e.preventDefault();
    p.ondrop = e => {
      e.preventDefault();
      for (let f of e.dataTransfer.files)
        if (f.type.startsWith('image/')) {
          let r = new FileReader;
          r.onload = () => cmd('insertImage', r.result);
          r.readAsDataURL(f)
        }
    };
    document.onkeydown = e => {
      let m = e.ctrlKey || e.metaKey,
        k = e.key.toLowerCase();
      if (m && 'biu'.includes(k)) {
        e.preventDefault();
        cmd({
          b: 'bold',
          i: 'italic',
          u: 'underline'
        } [k])
      }
    };
    p.oninput = update;
    p.onkeyup = update;
    const K = 'minieditor';

    function save() {
      try {
        localStorage.setItem(K, JSON.stringify({
          h: p.innerHTML,
          n: $('filename').textContent,
          x: $('extension').textContent
        }))
      } catch (e) {}
    }

    function load() {
      try {
        let d = JSON.parse(localStorage.getItem(K));
        if (d) {
          p.innerHTML = d.h;
          $('filename').textContent = d.n;
          $('extension').textContent = d.x
        }
      } catch (e) {}
    }

    function update() {
      let t = p.innerText.replace(/\s+/g, ' ').trim();
      $('stat').textContent = (t ? t.split(' ').length : 0) + ' words · ' + t.length + ' characters';
      save()
    }
    try {
      if (localStorage.getItem('minieditor-theme') === 'dark') document.body.classList.add('dark')
    } catch (e) {}
    load();
    update();
    $('filename').oninput = $('extension').oninput = save;
    document.querySelectorAll('#filename,#extension').forEach(el => el.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        el.blur()
      }
    }));

  </script>
</body>

</html>
